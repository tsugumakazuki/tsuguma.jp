<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツグマーケ株式会社</title>
<meta name="description" content="ツグマーケ株式会社は、データ分析・マーケティング設計・オペレーション最適化・組織設計を支援します。">
<link rel="canonical" href="https://tsuguma.jp/">
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --accent: #1f4e79;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --text: #ececec;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --accent: #8db8e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { padding: 96px 0 64px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: .04em; margin: 0; }
  section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .16em; color: var(--accent); margin: 0 0 24px; }
  ul.services { list-style: none; margin: 0; padding: 0; }
  ul.services li { padding: 16px 0; border-top: 1px solid var(--line); }
  ul.services li:first-child { border-top: 0; padding-top: 0; }
  .name { font-weight: 600; font-size: 17px; }
  .desc { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
  footer { padding: 40px 0 56px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>ツグマーケ株式会社</h1>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap">
        <h2>SERVICES</h2>
        <ul class="services">
          <li>
            <div class="name">データ分析</div>
            <div class="desc">事業データを整理・分析し、意思決定に使える示唆を導きます。</div>
          </li>
          <li>
            <div class="name">マーケティング設計</div>
            <div class="desc">顧客理解をもとに、戦略から施策までを一貫して設計します。</div>
          </li>
          <li>
            <div class="name">オペレーション最適化</div>
            <div class="desc">業務の流れを見直し、ムダを減らして成果につながる体制を整えます。</div>
          </li>
          <li>
            <div class="name">組織設計</div>
            <div class="desc">役割と仕組みを整理し、事業の成長を支える組織をつくります。</div>
          </li>
        </ul>
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2>CONTACT</h2>
        <p>お問い合わせはメールにて承ります。<br>
        <a href="mailto:info@tsuguma.jp">info@tsuguma.jp</a></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">&copy; <span id="y">2026</span> ツグマーケ株式会社</div>
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
